<!doctype html>
<html lang="en" class="h-full w-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var validThemes = [
            'emerald', 'ocean', 'violet', 'amber', 'rose', 'neo-brutalism', 'nordic-frost', 'terracotta'
          ];
          var saved = localStorage.getItem('erp_theme_id');
          if (!saved) {
            try {
              var sessionUser = localStorage.getItem('samp_auth_user');
              if (sessionUser) {
                var parsed = JSON.parse(sessionUser);
                if (parsed && parsed.theme_id) saved = parsed.theme_id;
              }
            } catch (e) {}
          }
          var themeId = (saved && validThemes.indexOf(saved) !== -1) ? saved : 'emerald';
          document.documentElement.dataset.theme = themeId;
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
    <title>Navneet SAMP Operations | Enterprise ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full w-full overflow-hidden bg-[var(--bg-app)] text-[var(--text-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
