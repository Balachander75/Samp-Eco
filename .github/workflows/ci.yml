name: Production CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. SECURITY & SAST AUDIT
  # =========================================================================
  security-audit:
    name: Security & SAST Audit (CVEs, Bandit SAST, npm Production Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install Security Scanners
        run: pip install pip-audit bandit

      - name: Scan Python Dependencies for Known CVEs (pip-audit)
        run: |
          pip-audit -r backend-new/requirements.txt

      - name: Static Application Security Testing (Bandit SAST)
        run: |
          bandit -r backend-new/app -ll -s B608,B104

      - name: Scan Frontend Production Dependencies for Known CVEs (npm audit)
        run: |
          cd frontend-new
          npm audit --omit=dev

  # =========================================================================
  # 2. BACKEND CI (LINTING, POSTGRES 16 MIGRATIONS, PYTEST & COVERAGE)
  # =========================================================================
  backend-ci:
    name: Backend CI (PostgreSQL 16 / Ruff / Pytest & Coverage)
    runs-on: ubuntu-latest
    needs: [security-audit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samp_enterprise_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-new/requirements.txt pytest httpx ruff pytest-cov

      - name: Code Quality & Syntax Verification (Ruff)
        run: |
          cd backend-new
          ruff check app tests --select E9,F63,F7,F82

      - name: Database Initialization & Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/samp_enterprise_db
          JWT_SECRET_KEY: test-secret-key-at-least-32-chars-long-for-ci
          APP_ENV: development
          DEBUG: "true"
        run: |
          cd backend-new
          python seed_db.py

      - name: Run Backend Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/samp_enterprise_db
          JWT_SECRET_KEY: test-secret-key-at-least-32-chars-long-for-ci
          APP_ENV: development
          DEBUG: "true"
        run: |
          cd backend-new
          pytest tests -v --cov=app --cov-report=term-missing

  # =========================================================================
  # 3. FRONTEND CI (VITEST, STRICT TYPESCRIPT, VITE BUNDLE)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Vitest / TypeScript / Production Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend-new
          npm ci

      - name: Run Vitest Unit Tests
        run: |
          cd frontend-new
          npm test

      - name: TypeScript & Production Bundle Build
        run: |
          cd frontend-new
          npm run build

  # =========================================================================
  # 4. CONTAINER & ORCHESTRATION VERIFICATION
  # =========================================================================
  docker-verification:
    name: Docker & Compose Orchestration Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q

      - name: Build Backend Container
        run: |
          docker build -t navneet-samp-backend:latest ./backend-new

      - name: Build Frontend Container
        run: |
          docker build -t navneet-samp-frontend:latest ./frontend-new
